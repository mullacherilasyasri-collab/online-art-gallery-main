<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArtVista | Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ArtVista
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="index.html#categories">Gallery</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- SIGNUP -->

    <section class="auth-section">

        <div class="auth-box">

            <p class="section-label">JOIN ARTVISTA</p>

            <h1>Create Your Account</h1>

            <p class="auth-subtitle">
                Create an account to explore our art collection.
            </p>


            <form onsubmit="signupUser(event)">

                <label>Full Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
