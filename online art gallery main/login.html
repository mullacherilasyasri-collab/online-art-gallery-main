<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArtVista | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ArtVista
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="index.html#categories">Gallery</a>

            <a href="signup.html">Sign Up</a>

        </div>

    </nav>


    <section class="auth-section">

        <div class="auth-box">

            <p class="section-label">WELCOME BACK</p>

            <h1>Login</h1>

            <p class="auth-subtitle">
                Login to continue exploring ArtVista.
            </p>


            <form onsubmit="loginUser(event)">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
